name: Juni
description: >-
  Juni is a Swedish fintech (headquartered in Göteborg, founded 2020) that
  provides a financial platform for ecommerce and digital businesses: business
  banking with multi-currency accounts, corporate and virtual cards, local and
  global payments, spend management, working-capital financing, and AI-driven
  accounting with integrations such as Fortnox. Juni is a licensed payment
  institution under the oversight of the Swedish Financial Supervisory Authority
  (SFSA) and is backed by EQT Ventures. It exposes a regulatory PSD2 / Open
  Banking (ASPSP) API surface for third-party providers, but publishes no public
  product API, SDKs, or developer portal. This profile was added to the API
  Evangelist network as a portfolio lead and enriched by the pipeline.
